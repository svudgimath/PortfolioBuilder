services:
  postgres:
    image: postgres:16
    container_name: portfolio_postgres
    restart: unless-stopped
    ports:
      - "5633:5432"
    environment:
      POSTGRES_DB: portfolio_builder
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_builder"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: portfolio-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: portfolio_user
      MONGO_INITDB_ROOT_PASSWORD: portfolio_pass
      MONGO_INITDB_DATABASE: dzigned
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
